spring.application.name=catalog
server.port=8080

# Conexión a PostgreSQL. Los valores por defecto son sólo de demostración local;
# en Docker los sobrescribe docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog}
spring.datasource.username=${DB_USER:catalog}
spring.datasource.password=${DB_PASSWORD:catalog_demo}

# Flyway crea el esquema; Hibernate sólo lo valida (nunca lo modifica).
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sesión HTTP en memoria (Spring Security). Un reinicio del backend cierra las sesiones.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# false para http://localhost; poner true al servir por HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
