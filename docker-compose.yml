services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_demo}
    volumes:
      # PostgreSQL 18 guarda los datos en un subdirectorio versionado de
      # /var/lib/postgresql, por eso el volumen se monta en esa ruta.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización PostgreSQL sólo
      # escucha por socket Unix, y así no se da por listo antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-catalog}
      DB_USER: ${POSTGRES_USER:-catalog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-catalog_demo}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sin -f: basta con que Tomcat responda (incluso 401); eso ocurre
      # después de que Flyway termine las migraciones.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
